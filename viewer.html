<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网络请求监视器</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <button id="btnRecord" class="tb-btn record on" title="停止记录网络日志 (Ctrl+E)" aria-label="记录"><span class="rec-dot"></span></button>
      <button id="btnClear" class="tb-btn" title="清除网络日志" aria-label="清除">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.8 12.2 12.2 3.8" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <span class="tb-sep"></span>
      <label class="tb-check"><input type="checkbox" id="chkPreserve"> 保留日志</label>
      <label class="tb-check"><input type="checkbox" id="chkDisableCache"> 禁用缓存</label>
      <span class="tb-sep"></span>
      <button id="btnReload" class="tb-btn text" title="重新加载页面，从头记录（筛选了某个标签页时刷新该标签页，否则刷新第一个标签页）">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13 8a5 5 0 1 1-1.5-3.55" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 2.5V5.5H10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        重新加载页面
      </button>
      <button id="btnExport" class="tb-btn text" title="把当前列表导出为 HAR 文件（含响应内容）">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        导出 HAR
      </button>
      <span class="tb-spacer"></span>
      <div class="tabs-wrap">
        <button id="btnTabs" class="tb-btn text target-btn" title="正在监视的标签页">
          <span id="connDot" class="conn-dot"></span><span id="tabsLabel">未连接</span><span class="caret">▾</span>
        </button>
        <div id="tabsPop" class="popover tabs-pop hidden">
          <div class="pop-title">正在监视的标签页</div>
          <ul id="tabsList" class="tabs-list"></ul>
          <div class="pop-title">自动加入</div>
          <label><input type="checkbox" data-sopt="followOpened"> 从这些标签页打开的新标签页 / 新窗口</label>
          <label><input type="checkbox" data-sopt="sameSite"> <span id="sameSiteLabel">访问同一网站的其他标签页</span></label>
          <label title="新页面刚打开时，页面本身的请求可能在插件连上之前就已发出。勾选后会在加入时刷新一次该页面，把这些请求补抓回来。注意：如果新页面是提交表单打开的，刷新可能会重复提交。">
            <input type="checkbox" data-sopt="reloadOnJoin"> 自动加入后刷新一次（补抓页面加载时的请求）
          </label>
          <div class="pop-title">手动添加</div>
          <div class="add-row">
            <select id="selAddTab"></select>
            <button id="btnAddTab" class="mini-btn">添加</button>
          </div>
        </div>
      </div>
    </header>

    <div class="filterbar">
      <div class="search">
        <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5"/></svg>
        <input id="txtFilter" type="text" spellcheck="false" placeholder="筛选" autocomplete="off">
        <button id="btnFilterHelp" class="help" title="筛选语法">?</button>
      </div>
      <label class="tb-check"><input type="checkbox" id="chkInvert"> 反转</label>
      <label class="tb-check" title="同时在请求体、响应内容、WebSocket 消息中搜索"><input type="checkbox" id="chkBody"> 搜索内容</label>
      <div class="more-wrap">
        <button id="btnMore" class="tb-btn text small">更多筛选 <span class="caret">▾</span></button>
        <div id="morePop" class="popover hidden">
          <label><input type="checkbox" data-opt="hideData"> 隐藏 data: 网址</label>
          <label><input type="checkbox" data-opt="hideExt"> 隐藏扩展程序网址</label>
          <label><input type="checkbox" data-opt="onlyErrors"> 仅显示失败请求（4xx/5xx/出错）</label>
          <label><input type="checkbox" data-opt="onlyThirdParty"> 仅显示第三方请求</label>
        </div>
      </div>
      <select id="selTabFilter" class="tab-filter hidden" title="只看某个标签页的请求"></select>
      <span class="tb-sep"></span>
      <div id="typeChips" class="chips" role="group" aria-label="资源类型"></div>
      <span class="tb-spacer"></span>
      <button id="btnDomains" class="tb-btn text small" title="按域名分类">域名分类</button>
    </div>

    <div id="filterHelp" class="filter-help hidden">
      <div><code>login</code> 网址包含 login　<code>/api\/v\d/</code> 正则　<code>-png</code> 排除</div>
      <div><code>domain:*.example.com</code>　<code>method:POST</code>　<code>status-code:4xx</code>　<code>mime-type:json</code>　<code>larger-than:100k</code>　<code>has-response-header:set-cookie</code>　<code>is:running</code></div>
      <div>多个条件用空格分隔，需全部满足。勾选「搜索内容」后，普通文本也会匹配请求体、响应内容和 WebSocket 消息。按住 Ctrl 点击类型标签可多选。</div>
    </div>

    <div id="banner" class="banner hidden"></div>

    <main id="main">
      <aside id="domainPane" class="hidden">
        <div class="pane-title">域名</div>
        <ul id="domainList"></ul>
      </aside>
      <section id="listPane">
        <div id="thead" class="thead"></div>
        <div id="tbody" class="tbody" tabindex="0">
          <div id="sizer"></div>
          <div id="rows"></div>
        </div>
        <div id="empty" class="empty hidden"></div>
      </section>
      <div id="splitter" class="splitter hidden" title="拖动调整宽度"></div>
      <section id="detailPane" class="hidden">
        <div class="detail-tabs">
          <button id="btnCloseDetail" class="close" title="关闭 (Esc)">✕</button>
          <div id="detailTabs" class="tabs" role="tablist"></div>
        </div>
        <div id="detailBody" class="detail-body"></div>
      </section>
    </main>

    <footer id="statusbar" class="statusbar"></footer>
  </div>

  <div id="ctxMenu" class="ctx hidden" role="menu"></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="src/viewer.js"></script>
</body>
</html>
